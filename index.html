<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f5" />

  <meta
    name="description"
    content="Armaan Mittal — Software Engineer & AI/ML Builder. Portfolio coming soon."
  />

  <title>Armaan Mittal — Building something new.</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #f7f7f5;
      color: #111111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    /*
      Large, extremely subtle futuristic glow.
      It moves very slowly so the page still feels minimal.
    */

    .orb {
      position: absolute;
      width: 42vw;
      height: 42vw;
      min-width: 420px;
      min-height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.18;
      background:
        radial-gradient(
          circle at 35% 35%,
          #b8c6ff 0%,
          #d8d1ff 30%,
          #e9e7ff 55%,
          transparent 72%
        );
      animation: drift 18s ease-in-out infinite alternate;
      transform: translate3d(-10%, -15%, 0);
    }

    .orb.second {
      width: 32vw;
      height: 32vw;
      min-width: 320px;
      min-height: 320px;
      right: -10%;
      bottom: -20%;
      background:
        radial-gradient(
          circle at center,
          #c5f3e8 0%,
          #d9f5ee 35%,
          transparent 70%
        );
      animation:
        driftTwo 22s ease-in-out infinite alternate;
      opacity: 0.15;
    }

    @keyframes drift {
      from {
        transform: translate3d(-10%, -15%, 0) scale(1);
      }

      to {
        transform: translate3d(10%, 5%, 0) scale(1.08);
      }
    }

    @keyframes driftTwo {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(-12%, -10%, 0) scale(1.1);
      }
    }


    /* =========================================================
       CURSOR GLOW
    ========================================================= */

    .cursor-glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.42) 0%,
          rgba(220, 225, 255, 0.16) 28%,
          transparent 68%
        );

      transform: translate(-50%, -50%);
      filter: blur(12px);
      opacity: 0;
      transition: opacity 0.4s ease;
    }


    /* =========================================================
       LAYOUT
    ========================================================= */

    main {
      position: relative;
      z-index: 2;

      min-height: 100vh;
      width: 100%;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding:
        clamp(28px, 5vw, 64px)
        clamp(24px, 7vw, 100px);
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      animation: appear 1s ease forwards;
      opacity: 0;
    }

    .logo {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #6b6b6b;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #111;

      box-shadow:
        0 0 0 4px rgba(17, 17, 17, 0.06);

      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      max-width: 980px;
      margin: auto 0;

      padding-top: 8vh;
      padding-bottom: 8vh;

      animation: heroIn 1.1s cubic-bezier(0.16, 1, 0.3, 1)
        0.12s forwards;

      opacity: 0;
      transform: translateY(25px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 30px;

      color: #777;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .eyebrow-line {
      width: 32px;
      height: 1px;
      background: #c8c8c8;
    }

    h1 {
      max-width: 900px;

      font-size: clamp(52px, 8.2vw, 118px);
      line-height: 0.96;
      letter-spacing: -0.065em;
      font-weight: 600;

      text-wrap: balance;
    }

    .highlight {
      color: #8b8b8b;
    }

    .description {
      max-width: 540px;

      margin-top: 34px;

      color: #646464;
      font-size: clamp(16px, 1.4vw, 20px);
      line-height: 1.55;
      letter-spacing: -0.015em;
    }


    /* =========================================================
       ACTIONS
    ========================================================= */

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-top: 42px;
    }

    .button {
      position: relative;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      min-height: 48px;
      padding: 0 19px;

      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      color: #111;

      font-size: 13px;
      font-weight: 500;

      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.03);

      transition:
        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(0, 0, 0, 0.18);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.07);
    }

    .button:active {
      transform: translateY(-1px);
    }

    .github-icon {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .arrow {
      font-size: 15px;
      transition: transform 0.3s ease;
    }

    .button:hover .arrow {
      transform: translate(2px, -2px);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      color: #858585;
      font-size: 11px;
      letter-spacing: 0.01em;

      animation: appear 1s ease 0.7s forwards;
      opacity: 0;
    }

    .footer-right {
      opacity: 0.65;
    }


    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes appear {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 700px) {
      main {
        padding:
          28px
          24px
          24px;
      }

      .hero {
        padding-top: 5vh;
        padding-bottom: 5vh;
      }

      h1 {
        font-size: clamp(50px, 15vw, 80px);
        line-height: 0.98;
      }

      .description {
        margin-top: 28px;
        font-size: 16px;
      }

      .actions {
        margin-top: 32px;
      }

      footer {
        font-size: 10px;
      }

      .footer-right {
        display: none;
      }

      .cursor-glow {
        display: none;
      }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .cursor-glow {
        display: none;
      }
    }
  </style>
</head>


<body>

  <!-- Subtle animated background -->
  <div class="background" aria-hidden="true">
    <div class="orb"></div>
    <div class="orb second"></div>
  </div>

  <!-- Cursor-following light -->
  <div class="cursor-glow" aria-hidden="true"></div>


  <main>

    <!-- HEADER -->
    <header>
      <div class="logo">
        AM.
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Portfolio coming soon
      </div>
    </header>


    <!-- HERO -->
    <section class="hero">

      <div class="eyebrow">
        <span class="eyebrow-line"></span>
        2026
      </div>

      <h1>
        Armaan Mittal
        <span class="highlight">— Building something new.</span>
      </h1>

      <p class="description">
        Software Engineer &amp; AI/ML Builder.
      </p>


      <div class="actions">

        <!-- GitHub -->
        <a
          class="button magnetic"
          href="https://github.com/armaanmittalweb"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Armaan Mittal on GitHub"
        >

          <!-- Inline GitHub SVG -->
          <svg
            class="github-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.85 10.91.57.1.78-.25.78-.55
              0-.27-.01-1.17-.01-2.13-3.19.69-3.87-1.35-3.87-1.35-.52-1.32-1.27-1.67-1.27-1.67
              -1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96
              .1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.18-3.1
              -.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0
              c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1
              0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18
              0 .3.21.65.79.54A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
            />
          </svg>

          GitHub

          <span class="arrow">↗</span>
        </a>


        <!-- Email -->
        <a
          class="button magnetic"
          href="mailto:me@amittal.dev"
          aria-label="Send an email to Armaan Mittal"
        >
          Get in touch
          <span class="arrow">↗</span>
        </a>

      </div>

    </section>


    <!-- FOOTER -->
    <footer>
      <span>© 2026 Armaan Mittal</span>
      <span class="footer-right">More to come.</span>
    </footer>

  </main>


  <script>
    /*
      =========================================================
      CURSOR EFFECT
      =========================================================

      A very subtle light follows the cursor on desktop.
      It is intentionally disabled on touch devices.
    */

    const cursorGlow = document.querySelector(".cursor-glow");

    const isTouchDevice =
      window.matchMedia("(pointer: coarse)").matches;

    if (!isTouchDevice) {
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      let currentX = mouseX;
      let currentY = mouseY;

      window.addEventListener("mousemove", (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;

        cursorGlow.style.opacity = "1";
      });

      window.addEventListener("mouseleave", () => {
        cursorGlow.style.opacity = "0";
      });

      function animateCursor() {
        currentX += (mouseX - currentX) * 0.08;
        currentY += (mouseY - currentY) * 0.08;

        cursorGlow.style.left = `${currentX}px`;
        cursorGlow.style.top = `${currentY}px`;

        requestAnimationFrame(animateCursor);
      }

      animateCursor();
    }


    /*
      =========================================================
      MAGNETIC BUTTONS
      =========================================================

      Buttons gently follow the cursor when hovered.
      This keeps the interaction playful without making
      the page feel like a traditional animated portfolio.
    */

    const magneticButtons =
      document.querySelectorAll(".magnetic");

    if (!isTouchDevice) {
      magneticButtons.forEach((button) => {

        button.addEventListener("mousemove", (event) => {

          const rect = button.getBoundingClientRect();

          const x =
            event.clientX -
            rect.left -
            rect.width / 2;

          const y =
            event.clientY -
            rect.top -
            rect.height / 2;

          button.style.transform =
            `translate(${x * 0.12}px, ${y * 0.12}px)`;
        });


        button.addEventListener("mouseleave", () => {
          button.style.transform = "";
        });

      });
    }
  </script>

</body>
</html>
