<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Armaan Mittal | Software Engineer & AI/ML Builder."
  />

  <meta name="theme-color" content="#f7f7f5" />

  <title>Armaan Mittal | Building something new.</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      background: #f7f7f5;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    .background {
      position: fixed;
      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 0;
    }


    /* =========================================================
       SOFT AURORA
    ========================================================= */

    .orb {
      position: absolute;

      width: 500px;
      height: 500px;

      left: -170px;
      top: -180px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(191, 199, 255, 0.30) 0%,
          rgba(215, 211, 255, 0.20) 32%,
          rgba(235, 233, 255, 0.08) 58%,
          transparent 72%
        );

      filter: blur(70px);

      animation:
        floatOne 18s ease-in-out infinite alternate;
    }


    .orb.two {
      width: 440px;
      height: 440px;

      left: auto;
      top: auto;

      right: -160px;
      bottom: -190px;

      background:
        radial-gradient(
          circle,
          rgba(190, 238, 226, 0.28) 0%,
          rgba(214, 243, 235, 0.15) 38%,
          transparent 72%
        );

      animation:
        floatTwo 22s ease-in-out infinite alternate;
    }


    @keyframes floatOne {
      from {
        transform:
          translate(0, 0)
          scale(1);
      }

      to {
        transform:
          translate(70px, 55px)
          scale(1.08);
      }
    }


    @keyframes floatTwo {
      from {
        transform:
          translate(0, 0)
          scale(1);
      }

      to {
        transform:
          translate(-70px, -50px)
          scale(1.08);
      }
    }


    /* =========================================================
       FLOATING SHAPES CONTAINER
    ========================================================= */

    .floating-shapes {
      position: absolute;
      inset: 0;

      pointer-events: none;
    }


    /* =========================================================
       BASE SHAPE
    ========================================================= */

    .shape {
      position: absolute;

      display: block;

      opacity: 0.35;

      will-change: transform;

      transform-origin: center;
    }


    /* =========================================================
       CIRCLES
    ========================================================= */

    .circle {
      border:
        1px solid rgba(17, 17, 17, 0.55);

      border-radius: 50%;
    }


    .circle-1 {
      width: 42px;
      height: 42px;
      left: 17%;
      top: 20%;
      animation: circleFloat1 8s ease-in-out infinite;
    }


    .circle-2 {
      width: 24px;
      height: 24px;
      left: 38%;
      top: 14%;
      animation: circleFloat2 6.5s ease-in-out infinite;
    }


    .circle-3 {
      width: 65px;
      height: 65px;
      right: 18%;
      top: 35%;
      animation: circleFloat3 10s ease-in-out infinite;
    }


    .circle-4 {
      width: 18px;
      height: 18px;
      left: 8%;
      bottom: 26%;
      animation: circleFloat4 7s ease-in-out infinite;
    }


    .circle-5 {
      width: 34px;
      height: 34px;
      left: 51%;
      bottom: 14%;
      animation: circleFloat5 9s ease-in-out infinite;
    }


    .circle-6 {
      width: 48px;
      height: 48px;
      right: 6%;
      top: 18%;
      animation: circleFloat6 8.5s ease-in-out infinite;
    }


    .circle-7 {
      width: 14px;
      height: 14px;
      left: 69%;
      top: 27%;
      animation: circleFloat7 5.5s ease-in-out infinite;
    }


    @keyframes circleFloat1 {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }

      50% {
        transform: translate(38px, -30px) rotate(90deg);
      }
    }


    @keyframes circleFloat2 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-25px, 38px);
      }
    }


    @keyframes circleFloat3 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(28px, -35px) scale(1.08);
      }
    }


    @keyframes circleFloat4 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(25px, -25px);
      }
    }


    @keyframes circleFloat5 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-32px, -24px);
      }
    }


    @keyframes circleFloat6 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-35px, 30px);
      }
    }


    @keyframes circleFloat7 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(20px, -35px);
      }
    }


    /* =========================================================
       SQUARES
    ========================================================= */

    .square {
      border:
        1px solid rgba(17, 17, 17, 0.52);

      transform: rotate(25deg);
    }


    .square-1 {
      width: 13px;
      height: 13px;
      left: 74%;
      top: 18%;
      animation: squareFloat1 6s ease-in-out infinite;
    }


    .square-2 {
      width: 10px;
      height: 10px;
      right: 11%;
      top: 48%;
      animation: squareFloat2 5.5s ease-in-out infinite;
    }


    .square-3 {
      width: 17px;
      height: 17px;
      left: 27%;
      bottom: 20%;
      animation: squareFloat3 8s ease-in-out infinite;
    }


    .square-4 {
      width: 8px;
      height: 8px;
      left: 55%;
      top: 11%;
      animation: squareFloat4 5s ease-in-out infinite;
    }


    .square-5 {
      width: 12px;
      height: 12px;
      left: 89%;
      bottom: 28%;
      animation: squareFloat5 7s ease-in-out infinite;
    }


    .square-6 {
      width: 20px;
      height: 20px;
      left: 6%;
      top: 54%;
      animation: squareFloat6 9s ease-in-out infinite;
    }


    @keyframes squareFloat1 {
      0%, 100% {
        transform: translate(0, 0) rotate(25deg);
      }

      50% {
        transform: translate(-30px, 35px) rotate(120deg);
      }
    }


    @keyframes squareFloat2 {
      0%, 100% {
        transform: translate(0, 0) rotate(25deg);
      }

      50% {
        transform: translate(-24px, -32px) rotate(110deg);
      }
    }


    @keyframes squareFloat3 {
      0%, 100% {
        transform: translate(0, 0) rotate(25deg);
      }

      50% {
        transform: translate(30px, -30px) rotate(145deg);
      }
    }


    @keyframes squareFloat4 {
      0%, 100% {
        transform: translate(0, 0) rotate(25deg);
      }

      50% {
        transform: translate(-25px, 30px) rotate(100deg);
      }
    }


    @keyframes squareFloat5 {
      0%, 100% {
        transform: translate(0, 0) rotate(25deg);
      }

      50% {
        transform: translate(-35px, -25px) rotate(135deg);
      }
    }


    @keyframes squareFloat6 {
      0%, 100% {
        transform: translate(0, 0) rotate(25deg);
      }

      50% {
        transform: translate(30px, 20px) rotate(150deg);
      }
    }


    /* =========================================================
       LARGE RINGS
    ========================================================= */

    .ring {
      border:
        1px solid rgba(17, 17, 17, 0.35);

      border-radius: 50%;
    }


    .ring-1 {
      width: 88px;
      height: 88px;
      right: 19%;
      top: 38%;
      animation: ringFloat1 11s ease-in-out infinite;
    }


    .ring-2 {
      width: 55px;
      height: 55px;
      left: 47%;
      bottom: 22%;
      animation: ringFloat2 8s ease-in-out infinite;
    }


    .ring-3 {
      width: 105px;
      height: 105px;
      left: -25px;
      bottom: 8%;
      animation: ringFloat3 13s ease-in-out infinite;
    }


    .ring-4 {
      width: 42px;
      height: 42px;
      right: 32%;
      bottom: 11%;
      animation: ringFloat4 7s ease-in-out infinite;
    }


    @keyframes ringFloat1 {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }

      50% {
        transform: translate(28px, -35px) rotate(45deg);
      }
    }


    @keyframes ringFloat2 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(32px, -28px);
      }
    }


    @keyframes ringFloat3 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(35px, -30px);
      }
    }


    @keyframes ringFloat4 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-25px, -25px);
      }
    }


    /* =========================================================
       DIAMONDS
    ========================================================= */

    .diamond {
      border:
        1px solid rgba(17, 17, 17, 0.52);

      transform: rotate(45deg);
    }


    .diamond-1 {
      width: 19px;
      height: 19px;
      left: 61%;
      bottom: 21%;
      animation: diamondFloat1 7s ease-in-out infinite;
    }


    .diamond-2 {
      width: 13px;
      height: 13px;
      left: 34%;
      top: 38%;
      animation: diamondFloat2 6s ease-in-out infinite;
    }


    .diamond-3 {
      width: 25px;
      height: 25px;
      right: 8%;
      bottom: 16%;
      animation: diamondFloat3 9s ease-in-out infinite;
    }


    .diamond-4 {
      width: 11px;
      height: 11px;
      left: 84%;
      top: 68%;
      animation: diamondFloat4 5s ease-in-out infinite;
    }


    @keyframes diamondFloat1 {
      0%, 100% {
        transform: translate(0, 0) rotate(45deg);
      }

      50% {
        transform: translate(35px, -28px) rotate(135deg);
      }
    }


    @keyframes diamondFloat2 {
      0%, 100% {
        transform: translate(0, 0) rotate(45deg);
      }

      50% {
        transform: translate(-30px, 25px) rotate(135deg);
      }
    }


    @keyframes diamondFloat3 {
      0%, 100% {
        transform: translate(0, 0) rotate(45deg);
      }

      50% {
        transform: translate(-30px, -30px) rotate(135deg);
      }
    }


    @keyframes diamondFloat4 {
      0%, 100% {
        transform: translate(0, 0) rotate(45deg);
      }

      50% {
        transform: translate(-20px, 28px) rotate(135deg);
      }
    }


    /* =========================================================
       DOTS
    ========================================================= */

    .dot {
      border-radius: 50%;

      background:
        rgba(17, 17, 17, 0.62);
    }


    .dot-1 {
      width: 7px;
      height: 7px;
      left: 84%;
      bottom: 31%;
      animation: dotFloat1 5s ease-in-out infinite;
    }


    .dot-2 {
      width: 5px;
      height: 5px;
      left: 67%;
      top: 23%;
      animation: dotFloat2 4.5s ease-in-out infinite;
    }


    .dot-3 {
      width: 4px;
      height: 4px;
      right: 5%;
      top: 72%;
      animation: dotFloat3 4s ease-in-out infinite;
    }


    .dot-4 {
      width: 6px;
      height: 6px;
      left: 45%;
      top: 28%;
      animation: dotFloat4 5.5s ease-in-out infinite;
    }


    .dot-5 {
      width: 4px;
      height: 4px;
      left: 22%;
      top: 69%;
      animation: dotFloat5 4.2s ease-in-out infinite;
    }


    .dot-6 {
      width: 8px;
      height: 8px;
      right: 27%;
      bottom: 9%;
      animation: dotFloat6 6s ease-in-out infinite;
    }


    @keyframes dotFloat1 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-25px, -35px);
      }
    }


    @keyframes dotFloat2 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(25px, 32px);
      }
    }


    @keyframes dotFloat3 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-30px, -25px);
      }
    }


    @keyframes dotFloat4 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(25px, -30px);
      }
    }


    @keyframes dotFloat5 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(30px, -20px);
      }
    }


    @keyframes dotFloat6 {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-25px, -30px);
      }
    }


    /* =========================================================
       FLOATING LINES
    ========================================================= */

    .line {
      height: 1px;

      background:
        rgba(17, 17, 17, 0.35);

      transform-origin: center;
    }


    .line-1 {
      width: 48px;
      left: 43%;
      bottom: 17%;
      transform: rotate(-28deg);
      animation: lineFloat1 8s ease-in-out infinite;
    }


    .line-2 {
      width: 32px;
      left: 77%;
      bottom: 18%;
      transform: rotate(22deg);
      animation: lineFloat2 7s ease-in-out infinite;
    }


    .line-3 {
      width: 38px;
      left: 13%;
      top: 41%;
      transform: rotate(55deg);
      animation: lineFloat3 9s ease-in-out infinite;
    }


    .line-4 {
      width: 25px;
      right: 14%;
      top: 27%;
      transform: rotate(-42deg);
      animation: lineFloat4 6s ease-in-out infinite;
    }


    @keyframes lineFloat1 {
      0%, 100% {
        transform: translate(0, 0) rotate(-28deg);
      }

      50% {
        transform: translate(-30px, -20px) rotate(-10deg);
      }
    }


    @keyframes lineFloat2 {
      0%, 100% {
        transform: translate(0, 0) rotate(22deg);
      }

      50% {
        transform: translate(-25px, -30px) rotate(45deg);
      }
    }


    @keyframes lineFloat3 {
      0%, 100% {
        transform: translate(0, 0) rotate(55deg);
      }

      50% {
        transform: translate(25px, 25px) rotate(80deg);
      }
    }


    @keyframes lineFloat4 {
      0%, 100% {
        transform: translate(0, 0) rotate(-42deg);
      }

      50% {
        transform: translate(-20px, 30px) rotate(-15deg);
      }
    }


    /* =========================================================
       CURSOR GLOW
    ========================================================= */

    .cursor-glow {
      position: fixed;

      width: 340px;
      height: 340px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      pointer-events: none;

      z-index: 1;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.32) 0%,
          rgba(225, 229, 255, 0.10) 35%,
          transparent 70%
        );

      filter: blur(12px);

      opacity: 0;

      transition:
        opacity 0.4s ease;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      position: relative;

      z-index: 2;

      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        34px
        clamp(42px, 5.5vw, 82px)
        28px;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      animation:
        fadeIn 0.8s ease forwards;

      opacity: 0;
    }


    .logo {
      font-size: 15px;
      line-height: 1;

      font-weight: 650;

      letter-spacing: -0.04em;
    }


    .status {
      display: flex;
      align-items: center;

      gap: 9px;

      color: #777777;

      font-size: 12px;
      font-weight: 450;

      letter-spacing: -0.01em;
    }


    .status-dot {
      width: 6px;
      height: 6px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #111111;

      box-shadow:
        0 0 0 4px rgba(17, 17, 17, 0.055);

      animation:
        pulse 2.5s ease-in-out infinite;
    }


    @keyframes pulse {
      0%,
      100% {
        opacity: 0.45;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      width: 100%;
      max-width: 1120px;

      margin: auto 0;

      transform:
        translateY(-2vh);

      animation:
        heroIn
        1.05s
        cubic-bezier(0.16, 1, 0.3, 1)
        0.08s
        forwards;

      opacity: 0;
    }


    /* =========================================================
       YEAR
    ========================================================= */

    .year {
      display: flex;
      align-items: center;

      gap: 14px;

      margin-bottom: 25px;

      color: #858585;

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.08em;
    }


    .year-line {
      width: 36px;
      height: 1px;

      background: #c9c9c9;
    }


    /* =========================================================
       HEADING
    ========================================================= */

    .heading {
      display: flex;
      flex-direction: column;

      max-width: 1000px;

      font-size:
        clamp(64px, 6vw, 92px);

      line-height: 0.98;

      letter-spacing: -0.065em;

      font-weight: 600;
    }


    .name {
      color: #111111;
    }


    .statement {
      color: #898989;

      font-size: 0.91em;

      margin-top: 2px;
    }


    /* =========================================================
       DESCRIPTION
    ========================================================= */

    .description {
      margin-top: 28px;

      color: #686868;

      font-size:
        clamp(16px, 1.25vw, 18px);

      line-height: 1.5;

      letter-spacing: -0.018em;
    }


    /* =========================================================
       ACTIONS
    ========================================================= */

    .actions {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-top: 30px;
    }


    .button {
      height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      padding:
        0 17px;

      border:
        1px solid rgba(0, 0, 0, 0.095);

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.58);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.025);

      font-size: 12px;

      font-weight: 500;

      transition:
        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }


    .button:hover {
      background:
        rgba(255, 255, 255, 0.90);

      border-color:
        rgba(0, 0, 0, 0.15);

      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.06);
    }


    .github-icon {
      width: 16px;
      height: 16px;

      fill: currentColor;
    }


    .arrow {
      font-size: 14px;

      transition:
        transform 0.25s ease;
    }


    .button:hover .arrow {
      transform:
        translate(2px, -2px);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      color: #888888;

      font-size: 10px;

      letter-spacing: 0.01em;

      animation:
        fadeIn 0.8s ease 0.55s forwards;

      opacity: 0;
    }


    /* =========================================================
       BASIC ANIMATIONS
    ========================================================= */

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    @keyframes heroIn {
      from {
        opacity: 0;

        transform:
          translateY(18px);
      }

      to {
        opacity: 1;

        transform:
          translateY(-2vh);
      }
    }


    /* =========================================================
       SHORT LAPTOPS
    ========================================================= */

    @media (
      min-width: 701px
    ) and (
      max-height: 800px
    ) {

      .page {
        padding-top: 28px;
        padding-bottom: 22px;
      }

      .hero {
        transform:
          translateY(-1vh);
      }

      .year {
        margin-bottom: 19px;
      }

      .heading {
        font-size:
          clamp(58px, 5.8vw, 82px);
      }

      .description {
        margin-top: 22px;
      }

      .actions {
        margin-top: 25px;
      }

      .ring-1 {
        right: 13%;
        top: 35%;
      }

      .circle-1 {
        left: 20%;
        top: 17%;
      }
    }


    /* =========================================================
       LARGE DESKTOP
    ========================================================= */

    @media (min-width: 1600px) {

      .heading {
        font-size: 96px;
      }

      .hero {
        max-width: 1180px;
      }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .page {
        padding:
          27px
          22px
          22px;
      }

      .status {
        font-size: 10px;
      }

      .hero {
        transform:
          translateY(-1vh);
      }

      .year {
        margin-bottom: 19px;
      }

      .year-line {
        width: 28px;
      }

      .heading {
        font-size:
          clamp(48px, 14vw, 72px);

        line-height: 0.98;

        letter-spacing: -0.065em;
      }

      .statement {
        font-size: 0.88em;

        margin-top: 4px;
      }

      .description {
        margin-top: 23px;

        font-size: 15px;
      }

      .actions {
        margin-top: 26px;
      }

      .button {
        height: 44px;

        padding:
          0 14px;
      }


      /* Keep the mobile background interesting,
         but prevent overcrowding. */

      .circle-1,
      .circle-3,
      .circle-5,
      .ring-3,
      .ring-4,
      .line-3,
      .line-4 {
        display: none;
      }

      .circle-2 {
        width: 22px;
        height: 22px;
        left: 15%;
        top: 25%;
      }

      .circle-4 {
        left: 10%;

  <script>

    /* =========================================================
       CURSOR FOLLOWING LIGHT
    ========================================================= */

    const cursorGlow =
      document.querySelector(".cursor-glow");

    const isTouch =
      window.matchMedia(
        "(pointer: coarse)"
      ).matches;


    if (!isTouch) {

      let mouseX =
        window.innerWidth / 2;

      let mouseY =
        window.innerHeight / 2;

      let currentX = mouseX;
      let currentY = mouseY;


      window.addEventListener(
        "mousemove",
        (event) => {

          mouseX =
            event.clientX;

          mouseY =
            event.clientY;

          cursorGlow.style.opacity =
            "1";

        }
      );


      window.addEventListener(
        "mouseleave",
        () => {

          cursorGlow.style.opacity =
            "0";

        }
      );


      function animateCursor() {

        currentX +=
          (mouseX - currentX) *
          0.075;

        currentY +=
          (mouseY - currentY) *
          0.075;


        cursorGlow.style.left =
          `${currentX}px`;

        cursorGlow.style.top =
          `${currentY}px`;


        requestAnimationFrame(
          animateCursor
        );

      }


      animateCursor();

    }


    /* =========================================================
       MAGNETIC BUTTONS
    ========================================================= */

    const buttons =
      document.querySelectorAll(
        ".magnetic"
      );


    if (!isTouch) {

      buttons.forEach(
        (button) => {

          button.addEventListener(
            "mousemove",
            (event) => {

              const rect =
                button.getBoundingClientRect();


              const x =
                event.clientX -
                rect.left -
                rect.width / 2;


              const y =
                event.clientY -
                rect.top -
                rect.height / 2;


              button.style.transform =
                `translate(
                  ${x * 0.10}px,
                  ${y * 0.10}px
                )`;

            }
          );


          button.addEventListener(
            "mouseleave",
            () => {

              button.style.transform =
                "";

            }
          );

        }
      );

    }


    /* =========================================================
       SUBTLE MOUSE PARALLAX FOR SHAPES
    ========================================================= */

    const shapes =
      document.querySelectorAll(
        ".shape"
      );


    if (!isTouch) {

      window.addEventListener(
        "mousemove",
        (event) => {

          const x =
            event.clientX /
              window.innerWidth -
            0.5;

          const y =
            event.clientY /
              window.innerHeight -
            0.5;


          shapes.forEach(
            (shape, index) => {

              const strength =
                2 +
                (index % 6) * 0.9;


              shape.style.marginLeft =
                `${x * strength}px`;

              shape.style.marginTop =
                `${y * strength}px`;

            }
          );

        }
      );

    }

  </script>
