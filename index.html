<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Armaan Mittal | Software Engineer & AI/ML Builder. Portfolio coming soon."
  />

  <meta name="theme-color" content="#f7f7f5" />

  <title>Armaan Mittal | Building something new.</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      background: #f7f7f5;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;

      width: 480px;
      height: 480px;

      left: -120px;
      top: -150px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 35%,
          rgba(184, 198, 255, 0.65) 0%,
          rgba(216, 209, 255, 0.42) 30%,
          rgba(233, 231, 255, 0.2) 52%,
          transparent 72%
        );

      filter: blur(75px);
      opacity: 0.55;

      animation: drift 18s ease-in-out infinite alternate;
    }

    .orb.second {
      width: 390px;
      height: 390px;

      left: auto;
      top: auto;
      right: -130px;
      bottom: -170px;

      background:
        radial-gradient(
          circle at center,
          rgba(197, 243, 232, 0.58) 0%,
          rgba(217, 245, 238, 0.28) 38%,
          transparent 72%
        );

      animation: driftTwo 22s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(90px, 60px, 0) scale(1.08);
      }
    }

    @keyframes driftTwo {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(-80px, -60px, 0) scale(1.08);
      }
    }


    /* =========================================================
       CURSOR LIGHT
    ========================================================= */

    .cursor-glow {
      position: fixed;

      width: 380px;
      height: 380px;

      left: 50%;
      top: 50%;

      border-radius: 50%;

      pointer-events: none;
      z-index: 1;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.38) 0%,
          rgba(220, 225, 255, 0.12) 32%,
          transparent 68%
        );

      filter: blur(10px);

      opacity: 0;

      transition: opacity 0.35s ease;
    }


    /* =========================================================
       MAIN LAYOUT
    ========================================================= */

    main {
      position: relative;
      z-index: 2;

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        34px
        clamp(44px, 5.5vw, 84px)
        28px;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      flex-shrink: 0;

      animation:
        fadeIn 0.9s ease forwards;

      opacity: 0;
    }

    .logo {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.035em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #777777;

      font-size: 12px;
      font-weight: 450;

      letter-spacing: 0.005em;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #111111;

      box-shadow:
        0 0 0 4px rgba(17, 17, 17, 0.055);

      animation:
        pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.5;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      width: 100%;
      max-width: 1100px;

      margin: auto 0;

      padding-top: 2vh;
      padding-bottom: 4vh;

      animation:
        heroIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;

      opacity: 0;
      transform: translateY(22px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 11px;

      margin-bottom: 24px;

      color: #858585;

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.08em;
    }

    .eyebrow-line {
      width: 27px;
      height: 1px;

      background: #c6c6c6;
    }


    /* =========================================================
       HEADING
    ========================================================= */

    h1 {
      max-width: 1080px;

      font-size:
        clamp(62px, 6.2vw, 102px);

      line-height: 0.98;

      letter-spacing: -0.058em;

      font-weight: 600;

      text-wrap: balance;
    }

    .heading-muted {
      color: #8a8a8a;
    }


    /* =========================================================
       DESCRIPTION
    ========================================================= */

    .description {
      margin-top: 25px;

      color: #666666;

      font-size:
        clamp(16px, 1.3vw, 18px);

      line-height: 1.5;

      letter-spacing: -0.012em;
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-top: 30px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      min-height: 45px;

      padding:
        0 17px;

      border:
        1px solid rgba(0, 0, 0, 0.095);

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.55);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.025);

      font-size: 12px;
      font-weight: 500;

      transition:
        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .button:hover {
      background:
        rgba(255, 255, 255, 0.88);

      border-color:
        rgba(0, 0, 0, 0.16);

      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.065);
    }

    .github-icon {
      width: 16px;
      height: 16px;

      fill: currentColor;
    }

    .arrow {
      font-size: 14px;

      transition:
        transform 0.25s ease;
    }

    .button:hover .arrow {
      transform:
        translate(2px, -2px);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      flex-shrink: 0;

      color: #858585;

      font-size: 10px;
      letter-spacing: 0.015em;

      animation:
        fadeIn 0.9s ease 0.65s forwards;

      opacity: 0;
    }

    .footer-right {
      opacity: 0.65;
    }


    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================================================
       LAPTOP HEIGHT OPTIMIZATION
    ========================================================= */

    @media (max-height: 800px) and (min-width: 701px) {

      main {
        padding-top: 27px;
        padding-bottom: 22px;
      }

      .hero {
        padding-top: 0;
        padding-bottom: 1vh;
      }

      .eyebrow {
        margin-bottom: 19px;
      }

      .description {
        margin-top: 20px;
      }

      .actions {
        margin-top: 25px;
      }
    }


    /* =========================================================
       LARGE DESKTOP
    ========================================================= */

    @media (min-width: 1600px) {

      main {
        padding-left: 7vw;
        padding-right: 7vw;
      }

      .hero {
        max-width: 1200px;
      }

      h1 {
        font-size: 104px;
      }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      body {
        overflow: hidden;
      }

      main {
        padding:
          27px
          23px
          23px;
      }

      .status {
        font-size: 10px;
      }

      .hero {
        padding-top: 2vh;
        padding-bottom: 3vh;
      }

      .eyebrow {
        margin-bottom: 20px;
      }

      h1 {
        font-size:
          clamp(48px, 14.5vw, 76px);

        line-height: 0.99;

        letter-spacing: -0.06em;
      }

      .description {
        margin-top: 23px;

        font-size: 15px;
      }

      .actions {
        margin-top: 27px;
      }

      .button {
        min-height: 44px;
        padding: 0 15px;
      }

      footer {
        font-size: 9px;
      }

      .footer-right {
        display: none;
      }

      .cursor-glow {
        display: none;
      }
    }


    /* =========================================================
       SMALL PHONES
    ========================================================= */

    @media (max-width: 390px) {

      main {
        padding-left: 19px;
        padding-right: 19px;
      }

      h1 {
        font-size: 47px;
      }

      .actions {
        gap: 8px;
      }

      .button {
        padding: 0 13px;
      }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .cursor-glow {
        display: none;
      }
    }
  </style>
</head>


<body>

  <!-- =======================================================
       BACKGROUND
  ======================================================== -->

  <div class="background" aria-hidden="true">
    <div class="orb"></div>
    <div class="orb second"></div>
  </div>


  <!-- =======================================================
       CURSOR EFFECT
  ======================================================== -->

  <div class="cursor-glow" aria-hidden="true"></div>


  <!-- =======================================================
       PAGE
  ======================================================== -->

  <main>

    <!-- HEADER -->

    <header>

      <div class="logo">
        AM.
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Portfolio coming soon
      </div>

    </header>


    <!-- HERO -->

    <section class="hero">

      <div class="eyebrow">
        <span class="eyebrow-line"></span>
        2026
      </div>


      <h1>
        Armaan Mittal
        <span class="heading-muted">
          Building something new.
        </span>
      </h1>


      <p class="description">
        Software Engineer &amp; AI/ML Builder.
      </p>


      <div class="actions">

        <!-- GITHUB -->

        <a
          class="button magnetic"
          href="https://github.com/armaanmittalweb"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Armaan Mittal on GitHub"
        >

          <svg
            class="github-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.85 10.91.57.1.78-.25.78-.55
              0-.27-.01-1.17-.01-2.13-3.19.69-3.87-1.35-3.87-1.35-.52-1.32-1.27-1.67-1.27-1.67
              -1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96
              .1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.18-3.1
              -.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0
              c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1
              0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18
              0 .3.21.65.79.54A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
            />
          </svg>

          GitHub

          <span class="arrow">↗</span>

        </a>


        <!-- EMAIL -->

        <a
          class="button magnetic"
          href="mailto:me@amittal.dev"
          aria-label="Email Armaan Mittal"
        >

          Get in touch

          <span class="arrow">↗</span>

        </a>

      </div>

    </section>


    <!-- FOOTER -->

    <footer>

      <span>
        © 2026 Armaan Mittal
      </span>

      <span class="footer-right">
        More to come.
      </span>

    </footer>

  </main>


  <script>
    /* =========================================================
       CURSOR FOLLOWING LIGHT
    ========================================================= */

    const cursorGlow =
      document.querySelector(".cursor-glow");

    const isTouchDevice =
      window.matchMedia("(pointer: coarse)").matches;

    if (!isTouchDevice) {

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      let currentX = mouseX;
      let currentY = mouseY;

      window.addEventListener("mousemove", (event) => {

        mouseX = event.clientX;
        mouseY = event.clientY;

        cursorGlow.style.opacity = "1";

      });

      window.addEventListener("mouseleave", () => {

        cursorGlow.style.opacity = "0";

      });


      function animateCursor() {

        currentX +=
          (mouseX - currentX) * 0.075;

        currentY +=
          (mouseY - currentY) * 0.075;

        cursorGlow.style.left =
          `${currentX}px`;

        cursorGlow.style.top =
          `${currentY}px`;

        requestAnimationFrame(
          animateCursor
        );
      }

      animateCursor();
    }


    /* =========================================================
       MAGNETIC BUTTONS
    ========================================================= */

    const magneticButtons =
      document.querySelectorAll(".magnetic");

    if (!isTouchDevice) {

      magneticButtons.forEach((button) => {

        button.addEventListener(
          "mousemove",
          (event) => {

            const rect =
              button.getBoundingClientRect();

            const x =
              event.clientX -
              rect.left -
              rect.width / 2;

            const y =
              event.clientY -
              rect.top -
              rect.height / 2;

            button.style.transform =
              `translate(${x * 0.10}px, ${y * 0.10}px)`;

          }
        );


        button.addEventListener(
          "mouseleave",
          () => {

            button.style.transform = "";

          }
        );

      });
    }
  </script>

</body>
</html>
