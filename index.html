<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Armaan Mittal | Software Engineer & AI/ML Builder."
  />

  <meta name="theme-color" content="#f7f7f5" />

  <title>Armaan Mittal | Building something new.</title>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      background: #f7f7f5;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    .background {
      position: fixed;
      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: 0;
    }


    /* =========================================================
       SOFT AURORA
    ========================================================= */

    .orb {
      position: absolute;

      width: 500px;
      height: 500px;

      left: -170px;
      top: -180px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(191, 199, 255, 0.30) 0%,
          rgba(215, 211, 255, 0.20) 32%,
          rgba(235, 233, 255, 0.08) 58%,
          transparent 72%
        );

      filter: blur(70px);

      animation:
        floatOne 18s ease-in-out infinite alternate;
    }


    .orb.two {
      width: 440px;
      height: 440px;

      left: auto;
      top: auto;

      right: -160px;
      bottom: -190px;

      background:
        radial-gradient(
          circle,
          rgba(190, 238, 226, 0.28) 0%,
          rgba(214, 243, 235, 0.15) 38%,
          transparent 72%
        );

      animation:
        floatTwo 22s ease-in-out infinite alternate;
    }


    @keyframes floatOne {

      from {
        transform:
          translate(0, 0)
          scale(1);
      }

      to {
        transform:
          translate(70px, 55px)
          scale(1.08);
      }

    }


    @keyframes floatTwo {

      from {
        transform:
          translate(0, 0)
          scale(1);
      }

      to {
        transform:
          translate(-70px, -50px)
          scale(1.08);
      }

    }


    /* =========================================================
       FLOATING SHAPES
    ========================================================= */

    .floating-shapes {
      position: absolute;
      inset: 0;

      pointer-events: none;
    }


    .shape {
      position: absolute;

      display: block;

      opacity: 0.16;

      will-change:
        transform;
    }


    /* Circle */

    .shape-circle {
      width: 42px;
      height: 42px;

      border:
        1px solid rgba(17, 17, 17, 0.34);

      border-radius: 50%;

      left: 18%;
      top: 21%;

      animation:
        floatCircle 13s ease-in-out infinite;
    }


    @keyframes floatCircle {

      0% {
        transform:
          translate3d(0, 0, 0)
          rotate(0deg);
      }

      50% {
        transform:
          translate3d(35px, -28px, 0)
          rotate(80deg);
      }

      100% {
        transform:
          translate3d(-10px, 25px, 0)
          rotate(160deg);
      }

    }


    /* Small square */

    .shape-square {
      width: 13px;
      height: 13px;

      border:
        1px solid rgba(17, 17, 17, 0.30);

      left: 74%;
      top: 19%;

      transform: rotate(24deg);

      animation:
        floatSquare 11s ease-in-out infinite;
    }


    @keyframes floatSquare {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          rotate(24deg);
      }

      50% {
        transform:
          translate3d(-24px, 38px, 0)
          rotate(115deg);
      }

    }


    /* Large ring */

    .shape-ring {
      width: 88px;
      height: 88px;

      border:
        1px solid rgba(17, 17, 17, 0.12);

      border-radius: 50%;

      right: 19%;
      top: 39%;

      animation:
        floatRing 17s ease-in-out infinite;
    }


    @keyframes floatRing {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          rotate(0deg);
      }

      50% {
        transform:
          translate3d(25px, -30px, 0)
          rotate(45deg);
      }

    }


    /* Diamond */

    .shape-diamond {
      width: 19px;
      height: 19px;

      border:
        1px solid rgba(17, 17, 17, 0.25);

      left: 61%;
      bottom: 22%;

      transform: rotate(45deg);

      animation:
        floatDiamond 15s ease-in-out infinite;
    }


    @keyframes floatDiamond {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          rotate(45deg);
      }

      50% {
        transform:
          translate3d(32px, -25px, 0)
          rotate(135deg);
      }

    }


    /* Tiny dot */

    .shape-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: rgba(17, 17, 17, 0.32);

      left: 84%;
      bottom: 31%;

      animation:
        floatDot 9s ease-in-out infinite;
    }


    @keyframes floatDot {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0);
      }

      50% {
        transform:
          translate3d(-20px, -32px, 0);
      }

    }


    /* Tiny horizontal line */

    .shape-line {
      width: 48px;
      height: 1px;

      background:
        rgba(17, 17, 17, 0.20);

      left: 43%;
      bottom: 17%;

      transform: rotate(-28deg);

      animation:
        floatLine 14s ease-in-out infinite;
    }


    @keyframes floatLine {

      0%,
      100% {
        transform:
          translate3d(0, 0, 0)
          rotate(-28deg);
      }

      50% {
        transform:
          translate3d(-28px, -18px, 0)
          rotate(-12deg);
      }

    }


    /* =========================================================
       CURSOR GLOW
    ========================================================= */

    .cursor-glow {
      position: fixed;

      width: 340px;
      height: 340px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      pointer-events: none;

      z-index: 1;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.32) 0%,
          rgba(225, 229, 255, 0.10) 35%,
          transparent 70%
        );

      filter: blur(12px);

      opacity: 0;

      transition:
        opacity 0.4s ease;
    }


    /* =========================================================
       PAGE
    ========================================================= */

    .page {
      position: relative;

      z-index: 2;

      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;

      padding:
        34px
        clamp(42px, 5.5vw, 82px)
        28px;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      animation:
        fadeIn 0.8s ease forwards;

      opacity: 0;
    }


    .logo {
      font-size: 15px;
      line-height: 1;

      font-weight: 650;

      letter-spacing: -0.04em;
    }


    .status {
      display: flex;
      align-items: center;

      gap: 9px;

      color: #777777;

      font-size: 12px;
      font-weight: 450;

      letter-spacing: -0.01em;
    }


    .status-dot {
      width: 6px;
      height: 6px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #111111;

      box-shadow:
        0 0 0 4px rgba(17, 17, 17, 0.055);

      animation:
        pulse 2.5s ease-in-out infinite;
    }


    @keyframes pulse {

      0%,
      100% {
        opacity: 0.45;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      width: 100%;
      max-width: 1120px;

      margin: auto 0;

      transform:
        translateY(-2vh);

      animation:
        heroIn
        1.05s
        cubic-bezier(0.16, 1, 0.3, 1)
        0.08s
        forwards;

      opacity: 0;
    }


    /* =========================================================
       YEAR
    ========================================================= */

    .year {
      display: flex;
      align-items: center;

      gap: 14px;

      margin-bottom: 25px;

      color: #858585;

      font-size: 11px;
      font-weight: 500;

      letter-spacing: 0.08em;
    }


    .year-line {
      width: 36px;
      height: 1px;

      background: #c9c9c9;
    }


    /* =========================================================
       HEADING
    ========================================================= */

    .heading {
      display: flex;
      flex-direction: column;

      max-width: 1000px;

      font-size:
        clamp(64px, 6vw, 92px);

      line-height: 0.98;

      letter-spacing: -0.065em;

      font-weight: 600;
    }


    .name {
      color: #111111;
    }


    .statement {
      color: #898989;

      font-size: 0.91em;

      margin-top: 2px;
    }


    /* =========================================================
       DESCRIPTION
    ========================================================= */

    .description {
      margin-top: 28px;

      color: #686868;

      font-size:
        clamp(16px, 1.25vw, 18px);

      line-height: 1.5;

      letter-spacing: -0.018em;
    }


    /* =========================================================
       ACTIONS
    ========================================================= */

    .actions {
      display: flex;
      align-items: center;

      gap: 10px;

      margin-top: 30px;
    }


    .button {
      height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      padding:
        0 17px;

      border:
        1px solid rgba(0, 0, 0, 0.095);

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.58);

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);

      box-shadow:
        0 1px 2px rgba(0, 0, 0, 0.025);

      font-size: 12px;

      font-weight: 500;

      transition:
        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }


    .button:hover {
      background:
        rgba(255, 255, 255, 0.90);

      border-color:
        rgba(0, 0, 0, 0.15);

      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.06);
    }


    .github-icon {
      width: 16px;
      height: 16px;

      fill: currentColor;
    }


    .arrow {
      font-size: 14px;

      transition:
        transform 0.25s ease;
    }


    .button:hover .arrow {
      transform:
        translate(2px, -2px);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;

      color: #888888;

      font-size: 10px;

      letter-spacing: 0.01em;

      animation:
        fadeIn 0.8s ease 0.55s forwards;

      opacity: 0;
    }


    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    @keyframes heroIn {

      from {
        opacity: 0;

        transform:
          translateY(18px);
      }

      to {
        opacity: 1;

        transform:
          translateY(-2vh);
      }

    }


    /* =========================================================
       SHORT LAPTOPS
    ========================================================= */

    @media (
      min-width: 701px
    ) and (
      max-height: 800px
    ) {

      .page {
        padding-top: 28px;
        padding-bottom: 22px;
      }

      .hero {
        transform:
          translateY(-1vh);
      }

      .year {
        margin-bottom: 19px;
      }

      .heading {
        font-size:
          clamp(58px, 5.8vw, 82px);
      }

      .description {
        margin-top: 22px;
      }

      .actions {
        margin-top: 25px;
      }

      /*
        Reduce background objects slightly on shorter screens.
      */

      .shape-ring {
        right: 13%;
        top: 35%;
      }

      .shape-circle {
        left: 20%;
        top: 17%;
      }
    }


    /* =========================================================
       LARGE DESKTOP
    ========================================================= */

    @media (min-width: 1600px) {

      .heading {
        font-size: 96px;
      }

      .hero {
        max-width: 1180px;
      }

    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .page {
        padding:
          27px
          22px
          22px;
      }

      .status {
        font-size: 10px;
      }

      .hero {
        transform:
          translateY(-1vh);
      }

      .year {
        margin-bottom: 19px;
      }

      .year-line {
        width: 28px;
      }

      .heading {
        font-size:
          clamp(48px, 14vw, 72px);

        line-height: 0.98;

        letter-spacing: -0.065em;
      }

      .statement {
        font-size: 0.88em;

        margin-top: 4px;
      }

      .description {
        margin-top: 23px;

        font-size: 15px;
      }

      .actions {
        margin-top: 26px;
      }

      .button {
        height: 44px;

        padding:
          0 14px;
      }

      /*
        Keep only a couple of shapes on mobile.
      */

      .shape-circle {
        width: 30px;
        height: 30px;

        left: 12%;
        top: 28%;
      }

      .shape-ring {
        width: 60px;
        height: 60px;

        right: 8%;
        top: 63%;
      }

      .shape-square {
        left: auto;
        right: 18%;
        top: 20%;
      }

      .shape-diamond,
      .shape-dot,
      .shape-line {
        display: none;
      }

      .cursor-glow {
        display: none;
      }

    }


    /* =========================================================
       SMALL PHONES
    ========================================================= */

    @media (max-width: 390px) {

      .page {
        padding-left: 19px;
        padding-right: 19px;
      }

      .heading {
        font-size: 47px;
      }

      .actions {
        gap: 8px;
      }

      .button {
        padding-left: 13px;
        padding-right: 13px;
      }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .cursor-glow {
        display: none;
      }

    }

  </style>
</head>


<body>

  <!-- =======================================================
       BACKGROUND
  ======================================================== -->

  <div class="background">

    <!-- Soft atmospheric gradients -->

    <div class="orb"></div>
    <div class="orb two"></div>


    <!-- Floating geometric elements -->

    <div class="floating-shapes">

      <span class="shape shape-circle"></span>

      <span class="shape shape-square"></span>

      <span class="shape shape-ring"></span>

      <span class="shape shape-diamond"></span>

      <span class="shape shape-dot"></span>

      <span class="shape shape-line"></span>

    </div>

  </div>


  <!-- =======================================================
       CURSOR LIGHT
  ======================================================== -->

  <div
    class="cursor-glow"
    aria-hidden="true"
  ></div>


  <!-- =======================================================
       PAGE
  ======================================================== -->

  <div class="page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

      <div class="logo">
        AM.
      </div>


      <div class="status">

        <span class="status-dot"></span>

        Portfolio coming soon

      </div>

    </header>


    <!-- =====================================================
         HERO
    ====================================================== -->

    <main class="hero">


      <div class="year">

        <span class="year-line"></span>

        <span>2026</span>

      </div>


      <h1 class="heading">

        <span class="name">
          Armaan Mittal
        </span>

        <span class="statement">
          Building something new.
        </span>

      </h1>


      <p class="description">
        Software Engineer &amp; AI/ML Builder.
      </p>


      <!-- ===================================================
           ACTIONS
      ==================================================== -->

      <div class="actions">


        <!-- GitHub -->

        <a
          class="button magnetic"
          href="https://github.com/armaanmittalweb"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Armaan Mittal on GitHub"
        >

          <svg
            class="github-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.85 10.91.57.1.78-.25.78-.55
              0-.27-.01-1.17-.01-2.13-3.19.69-3.87-1.35-3.87-1.35-.52-1.32-1.27-1.67-1.27-1.67
              -1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.34.96
              .1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.18-3.1
              -.12-.29-.51-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0
              c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.77.11 3.06.73.81 1.18 1.84 1.18 3.1
              0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18
              0 .3.21.65.79.54A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
            />

          </svg>


          <span>
            GitHub
          </span>


          <span class="arrow">
            ↗
          </span>

        </a>


        <!-- Email -->

        <a
          class="button magnetic"
          href="mailto:me@amittal.dev"
          aria-label="Email Armaan Mittal"
        >

          <span>
            Get in touch
          </span>


          <span class="arrow">
            ↗
          </span>

        </a>

      </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

      <span>
        © 2026 Armaan Mittal
      </span>

    </footer>

  </div>


  <script>

    /* =========================================================
       CURSOR LIGHT
    ========================================================= */

    const cursorGlow =
      document.querySelector(".cursor-glow");

    const isTouch =
      window.matchMedia(
        "(pointer: coarse)"
      ).matches;


    if (!isTouch) {

      let mouseX =
        window.innerWidth / 2;

      let mouseY =
        window.innerHeight / 2;

      let currentX = mouseX;
      let currentY = mouseY;


      window.addEventListener(
        "mousemove",
        (event) => {

          mouseX =
            event.clientX;

          mouseY =
            event.clientY;

          cursorGlow.style.opacity =
            "1";

        }
      );


      window.addEventListener(
        "mouseleave",
        () => {

          cursorGlow.style.opacity =
            "0";

        }
      );


      function animateCursor() {

        currentX +=
          (mouseX - currentX) *
          0.075;

        currentY +=
          (mouseY - currentY) *
          0.075;


        cursorGlow.style.left =
          `${currentX}px`;

        cursorGlow.style.top =
          `${currentY}px`;


        requestAnimationFrame(
          animateCursor
        );

      }


      animateCursor();

    }


    /* =========================================================
       MAGNETIC BUTTONS
    ========================================================= */

    const buttons =
      document.querySelectorAll(
        ".magnetic"
      );


    if (!isTouch) {

      buttons.forEach(
        (button) => {

          button.addEventListener(
            "mousemove",
            (event) => {

              const rect =
                button.getBoundingClientRect();


              const x =
                event.clientX -
                rect.left -
                rect.width / 2;


              const y =
                event.clientY -
                rect.top -
                rect.height / 2;


              button.style.transform =
                `translate(
                  ${x * 0.10}px,
                  ${y * 0.10}px
                )`;

            }
          );


          button.addEventListener(
            "mouseleave",
            () => {

              button.style.transform =
                "";

            }
          );

        }
      );

    }


    /* =========================================================
       SUBTLE SHAPE PARALLAX
    ========================================================= */

    const shapes =
      document.querySelectorAll(
        ".shape"
      );


    if (!isTouch) {

      window.addEventListener(
        "mousemove",
        (event) => {

          const x =
            (event.clientX /
              window.innerWidth -
              0.5);

          const y =
            (event.clientY /
              window.innerHeight -
              0.5);


          shapes.forEach(
            (shape, index) => {

              const strength =
                5 + index * 1.5;


              shape.style.marginLeft =
                `${x * strength}px`;

              shape.style.marginTop =
                `${y * strength}px`;

            }
          );

        }
      );

    }

  </script>

</body>
